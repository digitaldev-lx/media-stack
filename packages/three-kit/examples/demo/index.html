<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  #hud { position: absolute; left: 40px; top: 30px; font: 700 22px monospace; color: #c6ff3d; letter-spacing: 0.1em; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="hud">HF3D KIT DEMO · DOM OVERLAY · <span id="tc"></span></div>
</div>
<script>
  window.__hf = window.__hf || {};
  window.__hf.buildReady = window.__hf.buildReady || {};
  window.__hf.buildReady["hf3d"] = new Promise(function (r) { window.__hf3dReady = r; });
  var tl = gsap.timeline({ paused: true });
  tl.to({}, { duration: 8 }, 0);
  window.__timelines["main"] = tl;
</script>
<script type="module">
import * as K from "./assets/hf3d.mjs";
const { THREE } = K;
const stage = new K.Stage({ canvas: document.getElementById("gl"), bloom: { intensity: 1.6, threshold: 0.7 } });

// ---- cena 1: neon + vidro + espelho + particulas + feixe
const s1 = new THREE.Scene(); s1.background = new THREE.Color(0x020205);
const c1 = new THREE.PerspectiveCamera(40, 16 / 9, 0.1, 400);
const floor = K.mirrorFloor({ size: 60, strength: 0.8, blur: 2 }); s1.add(floor);
const title = K.text3d("HF3D", { font: "assets/inter-900.woff", size: 2.2, color: 0x7c5cff, intensity: 6 });
title.mesh.position.set(0, 1.6, 0); s1.add(title.mesh);
const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.9, 0.3, 220, 32), K.glass({ tint: 0x88ccff }));
knot.position.set(-4, 1.3, 1); s1.add(knot);
const ring = K.neonTube(Array.from({ length: 64 }, (_, i) => new THREE.Vector3(Math.cos(i / 64 * Math.PI * 2) * 3.4, 0.05, Math.sin(i / 64 * Math.PI * 2) * 3.4)), { color: 0x22d3ee, radius: 0.04, intensity: 7, closed: true });
s1.add(ring);
const holo = new THREE.Mesh(new THREE.SphereGeometry(0.9, 64, 32), K.hologram({ color: 0xff3d81 })); holo.position.set(4, 1.3, 0.5); s1.add(holo);
const beam = K.lightBeam({ color: 0x7c5cff, height: 9, bottom: 2.8, intensity: 0.9 }); beam.position.set(0, 9, 0); s1.add(beam);
const p1 = K.particleField({ count: 5000, spread: [30, 10, 30], size: 16, intensity: 2.5 }); p1.position.y = 4; s1.add(p1);
s1.add(new THREE.PointLight(0x7c5cff, 40, 20).translateY(3));
const cam1 = K.cameraPath(c1, [[-6, 2.2, 11], [0, 2.6, 9], [6, 2, 10]], [0, 1.2, 0]);
stage.add("s1", { scene: s1, camera: c1, update(t) { cam1.at(t / 4.6); knot.rotation.set(t * 0.4, t * 0.6, 0); holo.material.uniforms.uTime.value = t; ring.setIntensity(K.flicker(t, 3)); p1.update(t); beam.update(t); } });

// ---- cena 2: agua + graficos + ondas + faiscas
const s2 = new THREE.Scene(); s2.background = new THREE.Color(0x01040a);
const c2 = new THREE.PerspectiveCamera(42, 16 / 9, 0.1, 500);
const water = K.waterPlane({ size: 200, color: 0x041a2e, distortion: 1.6 }); s2.add(water);
const bars = K.bars3d([1.2, 2.2, 1.6, 3.1, 2.5, 3.8], { colors: [0x7c5cff, 0xff3d81, 0x22d3ee] }); bars.position.set(-2.5, 0.05, -2); s2.add(bars);
const line = K.line3d([[-5, 1, 1], [-3, 2.2, 1], [-1, 1.6, 1], [1, 3.4, 1], [3, 2.8, 1], [5, 4.4, 1]], { color: 0xc6ff3d }); s2.add(line);
const pool = new THREE.Mesh(new THREE.RingGeometry(0.001, 2.4, 160, 80), K.rippleWater({ color: 0x0b4a6c, drops: [[0, 0, 4.4], [0.8, -0.5, 5.4], [-0.6, 0.4, 6.2]] }));
pool.rotation.x = -Math.PI / 2; pool.position.set(4.5, 0.4, 2); s2.add(pool);
const burst = K.sparkBurst({ t0: 5.2, speed: 7 }); burst.position.set(1, 3, 0); s2.add(burst);
for (let i = 0; i < 5; i++) { const p = K.neonTube([new THREE.Vector3(-8 + i * 4, 0, -6), new THREE.Vector3(-8 + i * 4, 5, -6)], { color: [0x7c5cff, 0xff3d81, 0xffb020, 0xc6ff3d, 0x22d3ee][i], radius: 0.06, intensity: 6 }); s2.add(p); }
const cam2 = K.cameraPath(c2, [[8, 3, 12], [0, 4, 11], [-6, 3, 10]], [0, 1.5, 0]);
stage.add("s2", { scene: s2, camera: c2, update(t) { cam2.at((t - 3.6) / 4.4); water.update(t); bars.update(K.prog(t, 4.2, 1.6)); line.update(K.prog(t, 4.6, 1.4)); pool.material.uniforms.uTime.value = t; burst.update(t); } });

stage.warm();
function render(t) {
  document.getElementById("tc").textContent = "t=" + t.toFixed(2);
  const T0 = 3.6, D = 0.8;
  if (t < T0) stage.render(t, "s1");
  else if (t < T0 + D) stage.render(t, "s1", "s2", (t - T0) / D, "warp", { chroma: 0.004 });
  else stage.render(t, "s2");
}
const tl = window.__timelines["main"];
K.bindTimeline(tl, 8, render);
Promise.all([title.ready]).then(() => { render(0); window.__hf3dReady(); });
</script>
</body>
</html>
